<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AREST OF - Генератор возражений</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e1a;color:#fff;padding-bottom:100px}
.header{background:linear-gradient(135deg,#1a1f2e,#0f1419);padding:20px 16px;border-bottom:2px solid #dc2626;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#dc2626,#991b1b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px}
.logo-text{font-size:26px;font-weight:800;color:#fff}
.logo-text span{color:#dc2626}
.back-btn{background:#1f2937;border:1px solid #374151;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;margin:16px;cursor:pointer;display:inline-block}
.container{margin:0 16px 20px}
.title{font-size:20px;font-weight:800;color:#fff;margin:20px 0 8px}
.subtitle{font-size:13px;color:#9ca3af;margin-bottom:20px}
.upload-zone{border:2px dashed #374151;border-radius:12px;padding:20px;text-align:center;margin-bottom:20px;background:rgba(31,41,55,0.5)}
.upload-zone input[type="file"]{display:none}
.file-label{display:block;padding:12px;background:#dc2626;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}
.file-name{margin-top:10px;color:#10b981;font-size:13px}
.form-group{margin-bottom:16px}
.label{display:block;font-size:13px;color:#9ca3af;margin-bottom:8px;font-weight:600}
.input{width:100%;padding:12px;background:#0a0e1a;border:1px solid #374151;border-radius:10px;color:#fff;font-size:14px}
.input:focus{outline:none;border-color:#dc2626}
.generate-btn{width:100%;padding:14px;background:linear-gradient(135deg,#dc2626,#991b1b);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px}
.result{display:none;margin:20px 0;padding:20px;background:#fff;color:#000;border-radius:8px;font-family:'Times New Roman',serif;font-size:11px;line-height:1.5}
.result.active{display:block}
.result-title{font-size:16px;font-weight:800;color:#dc2626;text-align:center;text-transform:uppercase;margin-bottom:16px}
.result-text{white-space:pre-wrap;margin-bottom:16px}
.download-btn{width:100%;padding:14px;background:#10b981;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<div class="logo">
<div class="logo-icon">⚖️</div>
<div class="logo-text">AREST<span>OF</span></div>
</div>
</div>

<button class="back-btn" onclick="history.back()">← Назад</button>

<div class="container">
<div class="title">🔒 Возражение на исп. надпись</div>
<div class="subtitle">Загрузите PDF или заполните форму вручную</div>

<div class="upload-zone">
<label class="file-label" onclick="document.getElementById('pdfFile').click()">
📤 Загрузить PDF с исп. надписью
</label>
<input type="file" id="pdfFile" accept=".pdf" onchange="handlePDFUpload(this)">
<div class="file-name" id="fileName"></div>
</div>

<div class="form-group">
<label class="label"> ФИО должника</label>
<input type="text" class="input" id="clientName" placeholder="АЛИМЖАНОВ ЕРБОЛ КАЙРАТОВИЧ">
</div>

<div class="form-group">
<label class="label">📍 Адрес</label>
<input type="text" class="input" id="clientAddress" placeholder="Жамбылская обл., Кордайский р-н, с. Енбек, ул. Агыбай дом №9">
</div>

<div class="form-group">
<label class="label">🆔 ИИН</label>
<input type="text" class="input" id="clientIIN" placeholder="960524301145">
</div>

<div class="form-group">
<label class="label">📞 Телефон</label>
<input type="text" class="input" id="clientPhone" placeholder="+7(700) 700-69-00">
</div>

<div class="form-group">
<label class="label">⚖️ Нотариус (адрес)</label>
<input type="text" class="input" id="notaryAddress" placeholder="Атырауской обл., г.Атырау, Атамбаева, 7/5, 6А">
</div>

<div class="form-group">
<label class="label">👤 ФИО нотариуса</label>
<input type="text" class="input" id="notaryName" placeholder="САРСЕНОВА БАГДАТ НУРИБАЕВНА">
</div>

<div class="form-group">
<label class="label">📅 Дата вынесения исп. надписи</label>
<input type="date" class="input" id="endorsementDate">
</div>

<div class="form-group">
<label class="label">🔢 Номер исп. надписи</label>
<input type="text" class="input" id="endorsementNumber" placeholder="27222">
</div>

<div class="form-group">
<label class="label">🏢 Взыскатель</label>
<input type="text" class="input" id="creditor" placeholder="ТОО «КА ID Collect»">
</div>

<div class="form-group">
<label class="label">💰 Сумма (тенге)</label>
<input type="text" class="input" id="debtAmount" placeholder="2 644 769">
</div>

<div class="form-group">
<label class="label">📥 Дата получения</label>
<input type="date" class="input" id="receiveDate">
</div>

<button class="generate-btn" onclick="generateDocument()">📄 Сгенерировать возражение</button>

<div class="result" id="result">
<div class="result-title">✅ Готовое возражение</div>
<div class="result-text" id="resultText"></div>
<button class="download-btn" onclick="downloadPDF()">📥 Скачать PDF</button>
</div>
</div>

<script>
const tg=window.Telegram.WebApp;
tg.ready();

function handlePDFUpload(input){
if(!input.files[0])return;
document.getElementById('fileName').textContent='✅ '+input.files[0].name;
// Просто подтверждаем загрузку - данные можно ввести вручную
tg.showAlert(' Файл загружен! Теперь заполните поля выше данными из этого документа.');
}

function generateDocument(){
const clientName=document.getElementById('clientName').value;
const clientAddress=document.getElementById('clientAddress').value;
const clientIIN=document.getElementById('clientIIN').value;
const clientPhone=document.getElementById('clientPhone').value;
const notaryAddress=document.getElementById('notaryAddress').value;
const notaryName=document.getElementById('notaryName').value;
const endorsementDate=formatDate(document.getElementById('endorsementDate').value);
const endorsementNumber=document.getElementById('endorsementNumber').value;
const creditor=document.getElementById('creditor').value;
const debtAmount=document.getElementById('debtAmount').value;
const receiveDate=formatDate(document.getElementById('receiveDate').value);

if(!clientName||!endorsementDate||!endorsementNumber||!debtAmount){
alert('⚠️ Заполните обязательные поля!');
return;
}

const clientInitials=clientName.split(' ').map(n=>n.charAt(0)).join('. ');

const text=`Нотариусу ${notaryAddress}
${notaryName}

От: ${clientName}
Адрес: ${clientAddress}
ИИН: ${clientIIN}
Тел: ${clientPhone}

ВОЗРАЖЕНИЕ

Вами ${endorsementDate} года была вынесена исполнительная надпись за № ${endorsementNumber} о взыскании с ${clientName} в пользу ${creditor} сумму задолженности в ${debtAmount} тенге.

С данной исполнительной надписью я не согласен, я не согласен с суммой, которую взыскатель просит взыскать.
Мне не удалось связаться с взыскателем, на мои звонки взыскатель не отвечает.

Исходя из этого из за того что между взыскателем и мной имеются разногласия по поводу суммы, взыскателю следует обратиться в суд для рассмотрения в судебном порядке, в порядке ГПК РК.

Ваша исполнительная надпись была получена мной ${receiveDate} года.

В пункте 1 ч 1 ст 92-2 закона «О нотариате» указано:
Исполнительная надпись совершается, если представленные документы подтверждают бесспорность задолженности или иной ответственности должника перед взыскателем.

Согласно закона «О нотариате»: «Должник вправе со дня получения копии исполнительной надписи направить нотариусу, совершившему исполнительную надпись, возражение против заявленного требования в письменном виде с уведомлением».

В ст. 92-8 закона «О нотариате» указано: «Нотариус выносит постановление об отмене исполнительной надписи не позднее трех рабочих дней со дня поступления возражения».

Также в законе «О нотариате» указано: в случае если постановлением нотариуса совершенная исполнительная надпись по возражению должника не отменена, оспаривание исполнительной надписи осуществляется в судебном порядке.

На основании вышеизложенного и руководствуясь законами РК:

ПРОШУ:

Исполнительная надпись от ${endorsementDate} года за № ${endorsementNumber} о взыскании с ${clientName} в пользу ${creditor} задолженности в размере ${debtAmount} тенге — отменить.

Заявитель: ${clientInitials}.

${receiveDate} г.`;

document.getElementById('resultText').textContent=text;
document.getElementById('result').classList.add('active');
window.scrollTo(0,document.body.scrollHeight);
}

function formatDate(dateStr){
if(!dateStr)return '___';
const date=new Date(dateStr);
const day=String(date.getDate()).padStart(2,'0');
const month=String(date.getMonth()+1).padStart(2,'0');
const year=date.getFullYear();
return `${day}.${month}.${year}`;
}

function downloadPDF(){
const{jsPDF}=window.jspdf;
const doc=new jsPDF();
const text=document.getElementById('resultText').textContent;
doc.setFont('times');
doc.setFontSize(10);
const split=doc.splitTextToSize(text,170);
doc.text(split,20,15);
doc.save('Vozrazhenie.pdf');
}
</script>
</body>
</html>
